Collection:
  get:
    operationId: listCompanyMembers
    tags:
      - Company Members
    summary: List a company's members (owner/manager only)
    security:
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Company members
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyMemberListResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not a company owner/manager
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

Invite:
  post:
    operationId: inviteCompanyMember
    tags:
      - Company Members
    summary: Invite an existing user (by email) as a company manager (owner only)
    security:
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/InviteMemberRequest'
    responses:
      '201':
        description: Member added
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyMemberResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not the company owner
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: No user found with this email
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: User is already an active member
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

ByMemberId:
  patch:
    operationId: updateCompanyMember
    tags:
      - Company Members
    summary: Update a member's status (owner only; cannot modify the owner)
    security:
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UpdateMemberRequest'
    responses:
      '200':
        description: Member updated
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyMemberResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not the company owner, or attempting to modify the owner
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Member not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
  delete:
    operationId: removeCompanyMember
    tags:
      - Company Members
    summary: Remove a member from the company (owner only; cannot remove the owner)
    security:
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Member removed
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyMemberResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not the company owner, or attempting to remove the owner
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Member not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
