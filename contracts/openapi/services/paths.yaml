Collection:
  post:
    operationId: createService
    tags:
      - Services
    summary: Create a service in a company's catalog (owner/manager only, starts as draft)
    security:
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateServiceRequest'
    responses:
      '201':
        description: Service created
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/ServiceResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not a company owner/manager
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
  get:
    operationId: listCompanyServices
    tags:
      - Services
    summary: List a company's services (published only for non-members, all statuses for owner/manager)
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Company services
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/ServiceListResponse'

ByServiceId:
  patch:
    operationId: updateService
    tags:
      - Services
    summary: Update or publish a service (owner/manager only)
    security:
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UpdateServiceRequest'
    responses:
      '200':
        description: Service updated
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/ServiceResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not a company owner/manager
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Service not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

PublicList:
  get:
    operationId: listPublicServices
    tags:
      - Services
    summary: Search and browse published services across companies (free-text search, category filter, pagination)
    parameters:
      - name: q
        in: query
        description: Free-text search across the service name and description
        schema:
          type: string
      - name: category
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
    responses:
      '200':
        description: Published services
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/PublicServiceListResponse'

BySlugId:
  get:
    operationId: getServiceById
    tags:
      - Services
    summary: Get a single service (published is public, draft/suspended visible to the owning company's owner/manager only)
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Service found
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/ServiceResponse'
      '404':
        description: Service not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

SpecialistsCollection:
  post:
    operationId: assignServiceSpecialist
    tags:
      - Services
    summary: Assign a specialist (already active at the company) to perform a service (owner/manager only)
    security:
      - bearerAuth: []
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/AssignServiceSpecialistRequest'
    responses:
      '201':
        description: Specialist assigned
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/ServiceSpecialistResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not a company owner/manager
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Service not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: Specialist is not active in this company, or is already assigned
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
  get:
    operationId: listServiceSpecialists
    tags:
      - Services
    summary: List specialists assigned to a service (visibility follows the service's own visibility rules)
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Assigned specialists
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/ServiceSpecialistListResponse'
      '404':
        description: Service not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

BySpecialistProfileId:
  delete:
    operationId: unassignServiceSpecialist
    tags:
      - Services
    summary: Remove a specialist from a service (owner/manager only)
    security:
      - bearerAuth: []
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: specialistProfileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Specialist unassigned
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/ServiceSpecialistResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not a company owner/manager
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Assignment not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

MyServices:
  get:
    operationId: listMySpecialistServices
    tags:
      - Services
    summary: List services the current user's specialist profile is assigned to perform
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Services the current user is assigned to perform
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/ServiceSpecialistListResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: This user does not have a specialist profile yet
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
