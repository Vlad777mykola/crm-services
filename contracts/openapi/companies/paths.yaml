CompaniesCollection:
  post:
    operationId: createCompany
    tags:
      - Companies
    summary: Create a company (creator becomes owner)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateCompanyRequest'
    responses:
      '201':
        description: Company created
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

Public:
  get:
    operationId: getPublicCompanies
    tags:
      - Companies
    summary: List published companies
    responses:
      '200':
        description: Published companies
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyListResponse'

Me:
  get:
    operationId: getMyCompanies
    tags:
      - Companies
    summary: List companies the current user is an active member of
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Current user's company memberships
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyMembershipListResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

CompanyById:
  get:
    operationId: getCompanyById
    tags:
      - Companies
    summary: Get a company by id (published companies are public; drafts are member-only)
    security:
      - {}
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Company found
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyResponse'
      '404':
        description: Company not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
  patch:
    operationId: updateCompany
    tags:
      - Companies
    summary: Update a company (owner/manager only)
    security:
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UpdateCompanyRequest'
    responses:
      '200':
        description: Company updated
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not a company owner/manager
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Company not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
