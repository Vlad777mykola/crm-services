CompaniesCollection:
  post:
    operationId: createCompany
    tags:
      - Companies
    summary: Create a company (creator becomes owner)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateCompanyRequest'
    responses:
      '201':
        description: Company created
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

Public:
  get:
    operationId: getPublicCompanies
    tags:
      - Companies
    summary: Search and list published companies (free-text search, category/city filters, pagination)
    parameters:
      - name: q
        in: query
        description: Free-text search across the company name and description
        schema:
          type: string
      - name: category
        in: query
        schema:
          type: string
      - name: city
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
    responses:
      '200':
        description: Published companies
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyListResponse'

Me:
  get:
    operationId: getMyCompanies
    tags:
      - Companies
    summary: List companies the current user is an active member of
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Current user's company memberships
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyMembershipListResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

CompanyById:
  get:
    operationId: getCompanyById
    tags:
      - Companies
    summary: Get a company by id (published companies are public; drafts are member-only)
    security:
      - {}
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Company found
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyResponse'
      '404':
        description: Company not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
  patch:
    operationId: updateCompany
    tags:
      - Companies
    summary: Update a company (owner/manager only)
    security:
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UpdateCompanyRequest'
    responses:
      '200':
        description: Company updated
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not a company owner/manager
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Company not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: Invalid status transition (e.g. a suspended company cannot be republished)
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

StatusHistory:
  get:
    operationId: getCompanyStatusHistory
    tags:
      - Companies
    summary: List a company's status transition history (owner/manager only)
    security:
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Company status history
        content:
          application/json:
            schema:
              $ref: '../audit/schemas.yaml#/StatusHistoryListResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not a company owner/manager
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
