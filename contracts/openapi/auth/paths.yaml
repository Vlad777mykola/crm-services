Register:
  post:
    operationId: registerUser
    tags:
      - Auth
    summary: Register a new user with email/password
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/RegisterRequest'
    responses:
      '201':
        description: User registered and logged in
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/AuthSessionResponse'
      '409':
        description: A user with this email already exists
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

Login:
  post:
    operationId: loginUser
    tags:
      - Auth
    summary: Log in with email/password
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/LoginRequest'
    responses:
      '200':
        description: Logged in
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/AuthSessionResponse'
      '401':
        description: Invalid email or password
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

Refresh:
  post:
    operationId: refreshSession
    tags:
      - Auth
    summary: Rotate the refresh token (from httpOnly cookie) and issue a new access token
    responses:
      '200':
        description: New access token issued
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/RefreshResponse'
      '401':
        description: Missing, invalid, or expired refresh token
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

Logout:
  post:
    operationId: logoutUser
    tags:
      - Auth
    summary: Revoke the current session (from httpOnly cookie) and clear the cookie
    responses:
      '200':
        description: Logged out
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/MessageResponse'

Me:
  get:
    operationId: getCurrentUser
    tags:
      - Auth
    summary: Get the current authenticated user's profile
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Current user
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/MeResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
