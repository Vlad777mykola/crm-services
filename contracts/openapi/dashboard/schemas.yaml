DashboardRole:
  type: string
  enum: [client, company, specialist]

PermissionAction:
  type: string
  description: >
    Stable permission/action name. See `contracts/permissions/actions.ts` for
    the canonical vocabulary. Computed by dashboard-service from the caller's
    role at read time - not stored, not a source of truth for enforcement
    (each owning service enforces its own rules independently). Frontend-only
    UX gate.
  enum:
    - company.members.invite
    - company.members.remove
    - company.members.change_role
    - company.services.manage
    - company.appointments.manage
    - appointments.view_own
    - appointments.cancel_own
    - appointments.approve
    - appointments.reschedule
    - specialist.availability.manage_own
    - specialist.availability.manage_company
    - specialist.appointments.view_own

DashboardAppointmentCounts:
  type: object
  properties:
    pending:
      type: integer
    approved:
      type: integer
    completed:
      type: integer
  required: [pending, approved, completed]

DashboardCompanyMembership:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    status:
      type: string
      enum: [draft, published, suspended]
    role:
      type: string
      enum: [owner, manager]
    permissions:
      type: array
      items:
        $ref: '#/PermissionAction'
  required: [id, name, status, role, permissions]

DashboardSpecialistSummary:
  type: object
  nullable: true
  properties:
    id:
      type: string
      format: uuid
    status:
      type: string
      enum: [draft, published, suspended]
    pendingCompanyRequests:
      type: integer
    activeCompanies:
      type: integer
    assignedServices:
      type: integer
    permissions:
      type: array
      items:
        $ref: '#/PermissionAction'
  required: [id, status, pendingCompanyRequests, activeCompanies, assignedServices, permissions]

AppDashboardSummary:
  type: object
  properties:
    roles:
      type: array
      items:
        $ref: '#/DashboardRole'
    unreadNotifications:
      type: integer
    appointments:
      $ref: '#/DashboardAppointmentCounts'
    companies:
      type: array
      items:
        $ref: '#/DashboardCompanyMembership'
    specialist:
      $ref: '#/DashboardSpecialistSummary'
    permissions:
      type: array
      items:
        $ref: '#/PermissionAction'
      description: Baseline permissions that apply regardless of role (e.g. managing your own appointments).
  required: [roles, unreadNotifications, appointments, companies, specialist, permissions]

AppDashboardSummaryResponse:
  type: object
  properties:
    message:
      type: string
    data:
      $ref: '#/AppDashboardSummary'
  required: [message, data]

DashboardServiceCounts:
  type: object
  properties:
    total:
      type: integer
    draft:
      type: integer
    published:
      type: integer
  required: [total, draft, published]

CompanyDashboardSummary:
  type: object
  properties:
    company:
      $ref: '../companies/schemas.yaml#/Company'
    role:
      type: string
      enum: [owner, manager]
    permissions:
      type: array
      items:
        $ref: '#/PermissionAction'
    pendingAppointments:
      type: integer
    activeSpecialists:
      type: integer
    pendingSpecialistRequests:
      type: integer
    activeMembers:
      type: integer
    services:
      $ref: '#/DashboardServiceCounts'
  required:
    - company
    - role
    - permissions
    - pendingAppointments
    - activeSpecialists
    - pendingSpecialistRequests
    - activeMembers
    - services

CompanyDashboardSummaryResponse:
  type: object
  properties:
    message:
      type: string
    data:
      $ref: '#/CompanyDashboardSummary'
  required: [message, data]
