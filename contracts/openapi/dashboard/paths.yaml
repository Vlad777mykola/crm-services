AppSummary:
  get:
    operationId: getAppDashboardSummary
    tags:
      - Dashboard
    summary: Get the current user's role-aware dashboard summary
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Dashboard summary
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/AppDashboardSummaryResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

CompanySummary:
  get:
    operationId: getCompanyDashboardSummary
    tags:
      - Dashboard
    summary: Get a company management dashboard summary (owner/manager only)
    security:
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Company dashboard summary
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyDashboardSummaryResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not a company owner/manager
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Company not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
