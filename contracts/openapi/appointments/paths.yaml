Collection:
  post:
    operationId: createAppointment
    tags:
      - Appointments
    summary: Request an appointment for a company's service (any authenticated user)
    security:
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateAppointmentRequest'
    responses:
      '201':
        description: Appointment requested
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/AppointmentResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Service (or preferred specialist) not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: Preferred specialist is not assigned to this service
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
  get:
    operationId: listCompanyAppointments
    tags:
      - Appointments
    summary: List a company's appointment requests (owner/manager only)
    security:
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Company appointments
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/AppointmentListResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not a company owner/manager
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

ByAppointmentId:
  patch:
    operationId: respondToAppointment
    tags:
      - Appointments
    summary: Approve or reject a pending appointment request (owner/manager only)
    security:
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/RespondToAppointmentRequest'
    responses:
      '200':
        description: Appointment updated
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/AppointmentResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not a company owner/manager
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Appointment not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: This appointment has already been responded to
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

Complete:
  post:
    operationId: completeAppointment
    tags:
      - Appointments
    summary: Mark an approved appointment as completed (owner/manager only)
    security:
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Appointment marked as completed
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/AppointmentResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not a company owner/manager
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Appointment not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: Only approved appointments can be marked as completed
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

Reschedule:
  post:
    operationId: rescheduleAppointment
    tags:
      - Appointments
    summary: Reschedule a pending/approved appointment's time (and, optionally, specialist for backward compatibility) (owner/manager only)
    security:
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/RescheduleAppointmentRequest'
    responses:
      '200':
        description: Appointment rescheduled
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/AppointmentResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not a company owner/manager
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Appointment or service not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: Selected slot is not available, or appointment can't be rescheduled
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

ReassignSpecialist:
  post:
    operationId: reassignAppointmentSpecialist
    tags:
      - Appointments
    summary: Reassign only the specialist on a pending/approved appointment, keeping the existing time slot (owner/manager only)
    security:
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/ReassignAppointmentSpecialistRequest'
    responses:
      '200':
        description: Appointment specialist reassigned
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/AppointmentResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not a company owner/manager
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Appointment or service not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: New specialist not assigned to the service, slot unavailable, or appointment can't be reassigned
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

ChangeService:
  post:
    operationId: changeAppointmentService
    tags:
      - Appointments
    summary: Change the service on a pending/approved appointment, keeping the same start time and specialist (owner/manager only)
    security:
      - bearerAuth: []
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/ChangeAppointmentServiceRequest'
    responses:
      '200':
        description: Appointment service changed
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/AppointmentResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not a company owner/manager
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Appointment or service not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: Current specialist not assigned to the new service, slot unavailable, or appointment can't change service
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

