CreateForAppointment:
  post:
    operationId: createReview
    tags:
      - Reviews
    summary: Leave a review for your own completed appointment (one per appointment)
    security:
      - bearerAuth: []
    parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateReviewRequest'
    responses:
      '201':
        description: Review created
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/ReviewResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Appointment not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: Only completed appointments can be reviewed, or a review already exists
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

