UsersCollection:
  post:
    operationId: createUser
    tags:
      - Users
    summary: Create a new user
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateUserRequest'
    responses:
      '201':
        description: User created
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/UserResponse'
      '409':
        description: A user with this email already exists
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

Me:
  get:
    operationId: getMyProfile
    tags:
      - Users
    summary: Get the current authenticated user's profile
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Current user profile
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/UserResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
  patch:
    operationId: updateMyProfile
    tags:
      - Users
    summary: Update the current authenticated user's profile
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UpdateUserRequest'
    responses:
      '200':
        description: Updated user profile
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/UserResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'

UserById:
  get:
    operationId: getUserById
    tags:
      - Users
    summary: Get a user by id
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: User found
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/UserResponse'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
