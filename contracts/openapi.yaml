openapi: 3.0.3
info:
  title: CRM Services API
  version: 0.1.0
servers:
  - url: http://localhost:4000
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Companies
  - name: Company Members
  - name: Specialists
  - name: Company Specialists
  - name: Services
  - name: Appointments
  - name: Notifications
  - name: Reviews
  - name: Dashboard
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            statusCode:
              type: integer
          required:
            - message
            - statusCode
      required:
        - error
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required:
        - page
        - pageSize
        - total
        - totalPages
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  uptime:
                    type: number
                  timestamp:
                    type: string
                required:
                  - status
                  - uptime
                  - timestamp
  /auth/register:
    $ref: './openapi/auth/paths.yaml#/Register'
  /auth/login:
    $ref: './openapi/auth/paths.yaml#/Login'
  /auth/refresh:
    $ref: './openapi/auth/paths.yaml#/Refresh'
  /auth/logout:
    $ref: './openapi/auth/paths.yaml#/Logout'
  /auth/me:
    $ref: './openapi/auth/paths.yaml#/Me'
  /users:
    $ref: './openapi/users/paths.yaml#/UsersCollection'
  /users/me:
    $ref: './openapi/users/paths.yaml#/Me'
  /users/{id}:
    $ref: './openapi/users/paths.yaml#/UserById'
  /companies:
    $ref: './openapi/companies/paths.yaml#/CompaniesCollection'
  /companies/public:
    $ref: './openapi/companies/paths.yaml#/Public'
  /companies/me:
    $ref: './openapi/companies/paths.yaml#/Me'
  /companies/{companyId}:
    $ref: './openapi/companies/paths.yaml#/CompanyById'
  /companies/{companyId}/members:
    $ref: './openapi/company-members/paths.yaml#/Collection'
  /companies/{companyId}/members/invite:
    $ref: './openapi/company-members/paths.yaml#/Invite'
  /companies/{companyId}/members/{memberId}:
    $ref: './openapi/company-members/paths.yaml#/ByMemberId'
  /specialists/profile:
    $ref: './openapi/specialists/paths.yaml#/Profile'
  /specialists/me:
    $ref: './openapi/specialists/paths.yaml#/Me'
  /specialists/public:
    $ref: './openapi/specialists/paths.yaml#/Public'
  /specialists/{specialistId}:
    $ref: './openapi/specialists/paths.yaml#/BySpecialistId'
  /companies/{companyId}/specialists/requests:
    $ref: './openapi/company-specialists/paths.yaml#/SendRequest'
  /companies/{companyId}/specialist-requests:
    $ref: './openapi/company-specialists/paths.yaml#/CompanyRequestsList'
  /companies/{companyId}/specialists:
    $ref: './openapi/company-specialists/paths.yaml#/CompanySpecialistsList'
  /specialists/me/company-requests:
    $ref: './openapi/company-specialists/paths.yaml#/MyCompanyRequests'
  /specialists/me/companies:
    $ref: './openapi/company-specialists/paths.yaml#/MySpecialistCompanies'
  /specialists/me/company-requests/{requestId}/accept:
    $ref: './openapi/company-specialists/paths.yaml#/AcceptRequest'
  /specialists/me/company-requests/{requestId}/reject:
    $ref: './openapi/company-specialists/paths.yaml#/RejectRequest'
  /companies/{companyId}/services:
    $ref: './openapi/services/paths.yaml#/Collection'
  /companies/{companyId}/services/{serviceId}:
    $ref: './openapi/services/paths.yaml#/ByServiceId'
  /services/public:
    $ref: './openapi/services/paths.yaml#/PublicList'
  /services/{serviceId}:
    $ref: './openapi/services/paths.yaml#/BySlugId'
  /services/{serviceId}/specialists:
    $ref: './openapi/services/paths.yaml#/SpecialistsCollection'
  /services/{serviceId}/specialists/{specialistProfileId}:
    $ref: './openapi/services/paths.yaml#/BySpecialistProfileId'
  /specialists/me/services:
    $ref: './openapi/services/paths.yaml#/MyServices'
  /companies/{companyId}/appointments:
    $ref: './openapi/appointments/paths.yaml#/Collection'
  /companies/{companyId}/appointments/{appointmentId}:
    $ref: './openapi/appointments/paths.yaml#/ByAppointmentId'
  /appointments/me:
    $ref: './openapi/appointments/paths.yaml#/MyAppointments'
  /appointments/{appointmentId}/cancel:
    $ref: './openapi/appointments/paths.yaml#/Cancel'
  /companies/{companyId}/appointments/{appointmentId}/complete:
    $ref: './openapi/appointments/paths.yaml#/Complete'
  /appointments/{appointmentId}/review:
    $ref: './openapi/reviews/paths.yaml#/CreateForAppointment'
  /companies/{companyId}/reviews:
    $ref: './openapi/reviews/paths.yaml#/CompanyReviews'
  /services/{serviceId}/reviews:
    $ref: './openapi/reviews/paths.yaml#/ServiceReviews'
  /specialists/{specialistId}/reviews:
    $ref: './openapi/reviews/paths.yaml#/SpecialistReviews'
  /notifications/me:
    $ref: './openapi/notifications/paths.yaml#/MyNotifications'
  /notifications/me/unread-count:
    $ref: './openapi/notifications/paths.yaml#/UnreadCount'
  /notifications/me/{notificationId}/read:
    $ref: './openapi/notifications/paths.yaml#/MarkRead'
  /notifications/me/read-all:
    $ref: './openapi/notifications/paths.yaml#/MarkAllRead'
  /app/summary:
    $ref: './openapi/dashboard/paths.yaml#/AppSummary'
  /companies/{companyId}/summary:
    $ref: './openapi/dashboard/paths.yaml#/CompanySummary'

