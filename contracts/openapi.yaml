openapi: 3.0.3
info:
  title: CRM Services API
  version: 0.1.0
servers:
  - url: http://localhost:4000
tags:
  - name: Health
  - name: Auth
  - name: Users
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            statusCode:
              type: integer
          required:
            - message
            - statusCode
      required:
        - error
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  uptime:
                    type: number
                  timestamp:
                    type: string
                required:
                  - status
                  - uptime
                  - timestamp
  /auth/register:
    $ref: './openapi/auth/paths.yaml#/Register'
  /auth/login:
    $ref: './openapi/auth/paths.yaml#/Login'
  /auth/refresh:
    $ref: './openapi/auth/paths.yaml#/Refresh'
  /auth/logout:
    $ref: './openapi/auth/paths.yaml#/Logout'
  /auth/me:
    $ref: './openapi/auth/paths.yaml#/Me'
  /users:
    $ref: './openapi/users/paths.yaml#/UsersCollection'
  /users/{id}:
    $ref: './openapi/users/paths.yaml#/UserById'
