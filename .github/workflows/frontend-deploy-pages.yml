# Deploys the frontend's static build to GitHub Pages - the real production
# target for now (S3 + CloudFront later, see
# docs/architecture/target-production-architecture.md). Never touches the
# backend or any other deploy unit.
name: frontend-deploy-pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - run: yarn install --frozen-lockfile
      - run: yarn workspace @crm/frontend build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
