# Guards against contract drift: every event schema under contracts/events
# must remain valid JSON Schema.
name: contract-check

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'frontend/**'
      - '.github/workflows/contract-check.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'frontend/**'
      - '.github/workflows/contract-check.yml'

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - run: yarn install --frozen-lockfile

      - run: npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv compile -s "contracts/events/*.v1.json" --spec=draft7 -c ajv-formats
