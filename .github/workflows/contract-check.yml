# Guards against contract drift: the backend's OpenAPI-generated types must
# match contracts/openapi.yaml, and every event schema under contracts/events
# must remain valid JSON Schema. Runs on any change that could break a
# contract, not just changes to contracts/ itself.
name: contract-check

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/contract-check.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/contract-check.yml'

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - run: yarn install --frozen-lockfile

      # Regenerates backend/src/autogenerated from contracts/openapi.yaml and
      # fails if that produces an uncommitted diff - the two must never drift.
      - run: yarn workspace @crm/backend openapi:check

      # Every event contract must parse as JSON and compile as a valid
      # draft-07 JSON Schema (envelope.v1.json plus one file per event type).
      - run: npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv compile -s "contracts/events/*.v1.json" --spec=draft7 -c ajv-formats
