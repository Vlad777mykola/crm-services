name: repo-smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Prod-parity smoke (companies image + gateway)
        run: yarn smoke:prod
