# Independent pipeline for services/metrics-service - builds only its own
# Docker image, never the backend or any sibling service.
name: metrics-service-ci

on:
  pull_request:
    paths:
      - 'services/metrics-service/**'
      - '.github/workflows/metrics-service-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/metrics-service/**'
      - '.github/workflows/metrics-service-ci.yml'

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/metrics-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: services/metrics-service/yarn.lock

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: echo "IMAGE_NAME=$(echo 'ghcr.io/${{ github.repository }}/metrics-service' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/metrics-service
          file: services/metrics-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
