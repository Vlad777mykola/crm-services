name: crm-services

# Core stack only: Postgres, Redis, and the backend API. This is the real
# minimal production shape - no RabbitMQ, no workers, no AI service. Add the
# other Compose files below to layer in event-driven infrastructure:
#   docker compose -f docker/docker-compose.yml up
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.events.yml --profile events up
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.events.yml -f docker/docker-compose.workers.yml --profile events --profile node-workers up
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.events.yml -f docker/docker-compose.ai.yml --profile events --profile python-workers up
# See docker/README.md and docs/architecture/target-production-architecture.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # Reserved infrastructure - not used by any application code yet. Kept in
  # the core stack (rather than behind a profile) so it's always available
  # once a real use case (rate limiting, cache, session blacklist,
  # distributed locks) is added. Never treat Redis as a source of truth.
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../backend/.env
    environment:
      # Overrides the .env file above (env_file has lower precedence than
      # environment in Compose) - this service always runs in production mode,
      # against the containers' internal hostnames.
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crm
      REDIS_URL: redis://redis:6379
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Local-parity/tools container only - not part of the real deploy path
  # (frontend deploys to GitHub Pages / later S3+CloudFront). Run with:
  #   docker compose -f docker/docker-compose.yml --profile tools up frontend
  frontend:
    profiles: ['tools']
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - '8080:80'

volumes:
  postgres-data:
  redis-data:
