# Event-driven infrastructure layer - RabbitMQ plus the one service allowed
# to publish to it on the backend's behalf (the outbox-publisher). Nothing
# here starts by default; combine with docker-compose.yml and enable the
# `events` profile:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.events.yml --profile events up
#
# The backend API itself never joins this profile - it only ever writes rows
# into its own `outbox_events` table (see backend/src/infrastructure/outbox);
# publishing to RabbitMQ is entirely this file's job.

services:
  rabbitmq:
    profiles: ['events']
    image: rabbitmq:3-management-alpine
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # management UI
    environment:
      # Local-only credentials. Production must inject real ones via secrets -
      # see services/outbox-publisher/.env.example and docs/architecture.
      RABBITMQ_DEFAULT_USER: crm
      RABBITMQ_DEFAULT_PASS: crm_local_only
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
      interval: 5s
      timeout: 5s
      retries: 10

  outbox-publisher:
    profiles: ['events']
    build:
      context: ../services/outbox-publisher
      dockerfile: Dockerfile
    env_file:
      - ../services/outbox-publisher/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crm
      RABBITMQ_URL: amqp://crm:crm_local_only@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq-data:
