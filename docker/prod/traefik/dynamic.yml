# Traefik file-provider config for docker/prod/compose.yml. Same router/rule/
# priority set as docker/dev/traefik/dynamic.container.yml, targeting the
# same Compose service DNS names (this stack's internal network) - only the
# entrypoint differs (:80, not :8080/:8081; no dashboard exposed at all here).
#
# Extracting a domain in production = add that service below (Docker image +
# `expose` port from service-port-registry.md) and repoint its router's
# `service:` target here, in this file only. Keep this file's routers in sync
# with docker/dev/traefik/dynamic.container.yml (same rule/priority, only the
# backend host differs between dev and prod).

http:
  middlewares:
    cors:
      headers:
        accessControlAllowCredentials: true
        accessControlAllowMethods:
          - GET
          - HEAD
          - POST
          - PATCH
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
          - X-Request-Id
        accessControlAllowOriginList:
          - http://localhost:5173
        accessControlMaxAge: 86400
        addVaryHeader: true

  routers:
    auth-service-health-root:
      rule: "Path(`/health`)"
      service: auth-service
      entryPoints: [web]
      priority: 15

    auth-service: # auth-service (Phase 2)
      rule: "PathPrefix(`/auth`)"
      service: auth-service
      entryPoints: [web]
      priority: 10

    users-service-me: # users-service (Phase 3)
      rule: "Path(`/users/me`)"
      service: users-service
      entryPoints: [web]
      priority: 100
    users-service-by-id: # users-service (Phase 3)
      rule: "PathRegexp(`^/users/[^/]+$`)"
      service: users-service
      entryPoints: [web]
      priority: 50

    # ---- Companies: ordered by priority, most specific = highest number ----
    company-members-service:
      rule: "PathRegexp(`^/companies/[^/]+/members`)"
      service: company-members-service
      entryPoints: [web]
      priority: 100
    services-catalog-service-company-services:
      rule: "PathRegexp(`^/companies/[^/]+/services`)"
      service: services-catalog-service
      entryPoints: [web]
      priority: 95
    appointments-service-company-appointments:
      rule: "PathRegexp(`^/companies/[^/]+/appointments`)"
      service: appointments-service
      entryPoints: [web]
      priority: 90
    company-specialists-service-requests-create:
      rule: "PathRegexp(`^/companies/[^/]+/specialists/requests$`)"
      service: company-specialists-service
      entryPoints: [web]
      priority: 89
    company-specialists-service-requests-list:
      rule: "PathRegexp(`^/companies/[^/]+/specialist-requests$`)"
      service: company-specialists-service
      entryPoints: [web]
      priority: 88
    company-specialists-service-list:
      rule: "PathRegexp(`^/companies/[^/]+/specialists$`)"
      service: company-specialists-service
      entryPoints: [web]
      priority: 87
    reviews-service-company-reviews:
      rule: "PathRegexp(`^/companies/[^/]+/reviews$`)"
      service: reviews-service
      entryPoints: [web]
      priority: 80
    dashboard-service-company-summary: # dashboard-service (Phase 15)
      rule: "PathRegexp(`^/companies/[^/]+/summary$`)"
      service: dashboard-service
      entryPoints: [web]
      priority: 79
    companies-service-status-history:
      rule: "PathRegexp(`^/companies/[^/]+/status-history$`)"
      service: companies-service
      entryPoints: [web]
      priority: 78
    companies-service-by-id: # also matches /companies/public, /companies/me
      rule: "PathRegexp(`^/companies/[^/]+$`)"
      service: companies-service
      entryPoints: [web]
      priority: 77
    companies-service-root: # POST /companies
      rule: "Path(`/companies`)"
      service: companies-service
      entryPoints: [web]
      priority: 77

    # ---- Specialists: ordered by priority, most specific = highest number ----
    specialists-service-profile-create:
      rule: "Path(`/specialists/profile`)"
      service: specialists-service
      entryPoints: [web]
      priority: 100
    specialists-service-status-history:
      rule: "Path(`/specialists/me/status-history`)"
      service: specialists-service
      entryPoints: [web]
      priority: 99
    services-catalog-service-my-services:
      rule: "Path(`/specialists/me/services`)"
      service: services-catalog-service
      entryPoints: [web]
      priority: 98
    company-specialists-service-company-requests:
      rule: "PathRegexp(`^/specialists/me/company-requests`)"
      service: company-specialists-service
      entryPoints: [web]
      priority: 97
    company-specialists-service-my-companies:
      rule: "Path(`/specialists/me/companies`)"
      service: company-specialists-service
      entryPoints: [web]
      priority: 96
    specialists-service-me:
      rule: "Path(`/specialists/me`)"
      service: specialists-service
      entryPoints: [web]
      priority: 95
    specialists-service-public:
      rule: "Path(`/specialists/public`)"
      service: specialists-service
      entryPoints: [web]
      priority: 94
    reviews-service-specialist-reviews:
      rule: "PathRegexp(`^/specialists/[^/]+/reviews$`)"
      service: reviews-service
      entryPoints: [web]
      priority: 85
    specialists-service-by-id:
      rule: "PathRegexp(`^/specialists/[^/]+$`)"
      service: specialists-service
      entryPoints: [web]
      priority: 84

    # ---- Services catalog ----
    reviews-service-service-reviews:
      rule: "PathRegexp(`^/services/[^/]+/reviews$`)"
      service: reviews-service
      entryPoints: [web]
      priority: 85
    services-catalog-service-specialists:
      rule: "PathRegexp(`^/services/[^/]+/specialists`)"
      service: services-catalog-service
      entryPoints: [web]
      priority: 30
    services-catalog-service-public:
      rule: "Path(`/services/public`)"
      service: services-catalog-service
      entryPoints: [web]
      priority: 20
    services-catalog-service-by-id:
      rule: "PathRegexp(`^/services/[^/]+$`)"
      service: services-catalog-service
      entryPoints: [web]
      priority: 15

    # ---- Appointments ----
    reviews-service-appointment-review:
      rule: "PathRegexp(`^/appointments/[^/]+/review$`)"
      service: reviews-service
      entryPoints: [web]
      priority: 85
    appointments-service-me:
      rule: "Path(`/appointments/me`)"
      service: appointments-service
      entryPoints: [web]
      priority: 80
    appointments-service-status-history:
      rule: "PathRegexp(`^/appointments/[^/]+/status-history$`)"
      service: appointments-service
      entryPoints: [web]
      priority: 80
    appointments-service-cancel:
      rule: "PathRegexp(`^/appointments/[^/]+/cancel$`)"
      service: appointments-service
      entryPoints: [web]
      priority: 80

    # ---- Notifications (Phase 11: notifications-service HTTP API) ----
    notifications-service:
      rule: "PathPrefix(`/notifications`)"
      service: notifications-service
      entryPoints: [web]
      priority: 10

    # ---- Dashboard (Phase 15: dashboard-service) ----
    dashboard-service-app-summary:
      rule: "Path(`/app/summary`)"
      service: dashboard-service
      entryPoints: [web]
      priority: 10

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth-service:4001"

    users-service:
      loadBalancer:
        servers:
          - url: "http://users-service:4002"

    companies-service:
      loadBalancer:
        servers:
          - url: "http://companies-service:4003"

    company-members-service:
      loadBalancer:
        servers:
          - url: "http://company-members-service:4004"

    specialists-service:
      loadBalancer:
        servers:
          - url: "http://specialists-service:4005"

    company-specialists-service:
      loadBalancer:
        servers:
          - url: "http://company-specialists-service:4006"

    services-catalog-service:
      loadBalancer:
        servers:
          - url: "http://services-catalog-service:4007"

    appointments-service:
      loadBalancer:
        servers:
          - url: "http://appointments-service:4008"

    reviews-service:
      loadBalancer:
        servers:
          - url: "http://reviews-service:4009"

    notifications-service:
      loadBalancer:
        servers:
          - url: "http://notifications-service:4300"

    dashboard-service:
      loadBalancer:
        servers:
          - url: "http://dashboard-service:4010"
