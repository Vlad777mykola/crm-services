# Temporary/cheap production shape - one VM running every deploy unit as a
# container behind Traefik. Real target production is Kubernetes/AWS EKS
# (see docs/architecture/target-production-architecture.md); this file is the
# interim option before that migration, not a replacement for it.
#
# NOT YET USED/VERIFIED - this is a scaffold matching the "Production
# deployment matrix" in target-production-architecture.md. Requires real
# .env.production files (never commit them) before it will run. Only the
# gateway publishes a host port; every other service uses `expose` only.
#
# Start (once .env.production files exist - see docker/prod/README.md):
#   docker compose -f docker/prod/compose.yml up -d --build
#
# Postgres/RabbitMQ here are self-hosted containers for the cheap/interim
# shape - swap for managed services (RDS, Amazon MQ, etc.) whenever that
# becomes available; nothing else in this file needs to change to do that
# beyond the connection URLs.

services:
  gateway:
    image: traefik:v3.0
    command:
      - '--providers.file.filename=/etc/traefik/dynamic.yml'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.web.http.middlewares=cors@file'
    ports:
      - '80:80' # the only port this stack publishes to the host/internet
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    restart: unless-stopped
    depends_on:
      - legacy-backend
      - auth-service
      - users-service
      - companies-service
      - company-members-service
      - specialists-service
      - company-specialists-service
      - services-catalog-service
      - appointments-service
      - reviews-service

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - '5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - '6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    env_file:
      - .env.production
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    expose:
      - '5672'
      - '15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Dedicated Postgres for ai-service - deliberately different var names
  # (AI_POSTGRES_*) from the main postgres above so both can be set in the
  # same docker/prod/.env.production without colliding or sharing credentials.
  postgres-ai:
    image: postgres:16-alpine
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${AI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AI_POSTGRES_DB}
    expose:
      - '5432'
    volumes:
      - postgres-ai-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${AI_POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  legacy-backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file:
      - ../../backend/.env.production
    environment:
      NODE_ENV: production
    expose:
      - '4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  outbox-publisher:
    build:
      context: ../../services/outbox-publisher
      dockerfile: Dockerfile
    env_file:
      - ../../services/outbox-publisher/.env.production
    environment:
      NODE_ENV: production
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notifications-service:
    build:
      context: ../../services/notifications-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/notifications-service/.env.production
    environment:
      NODE_ENV: production
    expose:
      - '4300'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  metrics-service:
    build:
      context: ../../services/metrics-service
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      METRICS_PORT: '4100'
    env_file:
      - ../../services/metrics-service/.env.production
    expose:
      - '4100'
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Extracted in Phase 2 - the gateway routes /auth/* here instead of
  # legacy-backend. Owns auth_schema in the shared `postgres` above.
  auth-service:
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/auth-service/.env.production
    environment:
      NODE_ENV: production
    expose:
      - '4001'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Same outbox-publisher image as the shared instance above, redeployed
  # against auth-service's own schema (Q8) - see
  # docs/architecture/service-port-registry.md.
  outbox-publisher-auth:
    build:
      context: ../../services/outbox-publisher
      dockerfile: Dockerfile
    env_file:
      # Deliberately NOT the same file as the `outbox-publisher` service above
      # - this one's DATABASE_URL must point at auth_schema (search_path
      # option), not the default/public schema. See docker/prod/README.md.
      - ../../services/outbox-publisher/.env.production.auth
    environment:
      NODE_ENV: production
      HEALTH_PORT: '4501'
    expose:
      - '4501'
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Extracted across Phase 2 (auth.user_registered consumer) and Phase 3
  # (GET/PATCH /users/me, GET /users/:id).
  users-service:
    build:
      context: ../../services/users-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/users-service/.env.production
    environment:
      NODE_ENV: production
    expose:
      - '4002'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Extracted in Phase 4. Still reads/writes legacy's `public.company_members`
  # directly until Phase 5 - see
  # services/companies-service/src/db/legacy-company-members-bridge.ts.
  companies-service:
    build:
      context: ../../services/companies-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/companies-service/.env.production
    environment:
      NODE_ENV: production
    expose:
      - '4003'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Same outbox-publisher image, redeployed against companies-service's own
  # schema (Q8).
  outbox-publisher-companies:
    build:
      context: ../../services/outbox-publisher
      dockerfile: Dockerfile
    env_file:
      - ../../services/outbox-publisher/.env.production.companies
    environment:
      NODE_ENV: production
      HEALTH_PORT: '4503'
    expose:
      - '4503'
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Extracted in Phase 5. Consumes company.created, publishes company-member.*.
  company-members-service:
    build:
      context: ../../services/company-members-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/company-members-service/.env.production
    environment:
      NODE_ENV: production
    expose:
      - '4004'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Same outbox-publisher image, redeployed against company-members-service's
  # own schema (Q8).
  outbox-publisher-company-members:
    build:
      context: ../../services/outbox-publisher
      dockerfile: Dockerfile
    env_file:
      - ../../services/outbox-publisher/.env.production.company-members
    environment:
      NODE_ENV: production
      HEALTH_PORT: '4504'
    expose:
      - '4504'
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Extracted in Phase 6. Owns specialist profile data.
  specialists-service:
    build:
      context: ../../services/specialists-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/specialists-service/.env.production
    environment:
      NODE_ENV: production
    expose:
      - '4005'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Same outbox-publisher image, redeployed against specialists-service's own
  # schema (Q8).
  outbox-publisher-specialists:
    build:
      context: ../../services/outbox-publisher
      dockerfile: Dockerfile
    env_file:
      - ../../services/outbox-publisher/.env.production.specialists
    environment:
      NODE_ENV: production
      HEALTH_PORT: '4505'
    expose:
      - '4505'
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Extracted in Phase 7. Owns company<->specialist requests/relations.
  company-specialists-service:
    build:
      context: ../../services/company-specialists-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/company-specialists-service/.env.production
    environment:
      NODE_ENV: production
    expose:
      - '4006'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Same outbox-publisher image, redeployed against company-specialists-service's
  # own schema (Q8).
  outbox-publisher-company-specialists:
    build:
      context: ../../services/outbox-publisher
      dockerfile: Dockerfile
    env_file:
      - ../../services/outbox-publisher/.env.production.company-specialists
    environment:
      NODE_ENV: production
      HEALTH_PORT: '4506'
    expose:
      - '4506'
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Extracted in Phase 8. Owns the service catalog + service-specialist assignment.
  services-catalog-service:
    build:
      context: ../../services/services-catalog-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/services-catalog-service/.env.production
    environment:
      NODE_ENV: production
    expose:
      - '4007'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Same outbox-publisher image, redeployed against services-catalog-service's
  # own schema (Q8).
  outbox-publisher-services-catalog:
    build:
      context: ../../services/outbox-publisher
      dockerfile: Dockerfile
    env_file:
      - ../../services/outbox-publisher/.env.production.services-catalog
    environment:
      NODE_ENV: production
      HEALTH_PORT: '4507'
    expose:
      - '4507'
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Extracted in Phase 9. Owns the appointment lifecycle; also a domain.events
  # consumer (local projections), so it depends on rabbitmq too.
  appointments-service:
    build:
      context: ../../services/appointments-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/appointments-service/.env.production
    environment:
      NODE_ENV: production
    expose:
      - '4008'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Same outbox-publisher image, redeployed against appointments-service's own
  # schema (Q8).
  outbox-publisher-appointments:
    build:
      context: ../../services/outbox-publisher
      dockerfile: Dockerfile
    env_file:
      - ../../services/outbox-publisher/.env.production.appointments
    environment:
      NODE_ENV: production
      HEALTH_PORT: '4508'
    expose:
      - '4508'
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Extracted in Phase 10. Owns reviews; HTTP-only, no RabbitMQ consumer.
  reviews-service:
    build:
      context: ../../services/reviews-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/reviews-service/.env.production
    environment:
      NODE_ENV: production
    expose:
      - '4009'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Same outbox-publisher image, redeployed against reviews-service's own
  # schema (Q8).
  outbox-publisher-reviews:
    build:
      context: ../../services/outbox-publisher
      dockerfile: Dockerfile
    env_file:
      - ../../services/outbox-publisher/.env.production.reviews
    environment:
      NODE_ENV: production
      HEALTH_PORT: '4509'
    expose:
      - '4509'
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    build:
      context: ../../services/ai-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/ai-service/.env.production
    environment:
      PYTHON_METRICS_PORT: '4200'
    expose:
      - '4200'
    depends_on:
      postgres-ai:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  postgres-ai-data:
