# Isolated test stack — distinct ports from dev (:5432) and verify (:25432).
# Project: crm-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm_test
    ports:
      - '15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 15

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - '15672:5672'
    environment:
      RABBITMQ_DEFAULT_USER: crm
      RABBITMQ_DEFAULT_PASS: crm_local_only
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
      interval: 5s
      timeout: 5s
      retries: 15

  gateway:
    image: traefik:v3.0
    command:
      - '--providers.file.directory=/etc/traefik/dynamic'
      - '--entrypoints.web.address=:8080'
      - '--ping=true'
    ports:
      - '18080:8080'
    volumes:
      - ../verify/traefik/dynamic.yml:/etc/traefik/dynamic/routes.yml:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
