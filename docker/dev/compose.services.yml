# Local dev app/worker services, containerized. Everything here is optional -
# the recommended day-to-day loop is `yarn dev` / `python src/main.py` per
# service instead (see docker/dev/README.md); use this file when you
# specifically want a service running in Docker (e.g. to leave it running in
# the background while you focus on a different one).
#
# Combine with compose.infra.yml:
#   docker compose -f docker/dev/compose.infra.yml -f docker/dev/compose.services.yml \
#     --profile events up outbox-publisher
#   docker compose -f docker/dev/compose.infra.yml -f docker/dev/compose.services.yml \
#     --profile events --profile node-workers up
#   docker compose -f docker/dev/compose.infra.yml -f docker/dev/compose.services.yml \
#     --profile events --profile python-workers up ai-service
#
# auth-service + users-service (Phase 2) have their own `auth` profile,
# independent of `node-workers`, so you can turn just these two (+ their own
# outbox-publisher instance) on/off without starting notifications-service/
# metrics-service/backend-projection-service too:
#   docker compose -f docker/dev/compose.infra.yml -f docker/dev/compose.services.yml \
#     --profile events --profile auth up

services:
  # Publishes the backend's own outbox_events to RabbitMQ. The backend API
  # itself never joins this profile - it only ever writes rows into its own
  # outbox_events table (see backend/src/infrastructure/outbox).
  outbox-publisher:
    profiles: ['events']
    build:
      context: ../../services/outbox-publisher
      dockerfile: Dockerfile
    env_file:
      - ../../services/outbox-publisher/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crm
      RABBITMQ_URL: amqp://crm:crm_local_only@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Same outbox-publisher image, redeployed against auth-service's own schema
  # (Q8 - see docs/architecture/service-port-registry.md). The `search_path`
  # option is required because outbox-publisher queries the unqualified table
  # name `outbox_events`, and this instance's table lives in `auth_schema`.
  # Own `auth` profile (not `events`) so it starts/stops together with
  # auth-service/users-service, not with the unrelated legacy outbox-publisher.
  outbox-publisher-auth:
    profiles: ['auth']
    build:
      context: ../../services/outbox-publisher
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crm?options=-c%20search_path%3Dauth_schema
      RABBITMQ_URL: amqp://crm:crm_local_only@rabbitmq:5672
      HEALTH_PORT: '4501'
    ports:
      - '4501:4501'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Owns identity/sessions/JWT issuance - see services/auth-service/README.md.
  # Only needs Postgres directly; publishing goes through outbox-publisher-auth.
  # Own `auth` profile (not `node-workers`) - see the `auth` profile note above.
  auth-service:
    profiles: ['auth']
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/auth-service/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crm
    ports:
      - '4001:4001'
    depends_on:
      postgres:
        condition: service_healthy

  # Consumes auth.user_registered (Phase 2) and serves GET/PATCH /users/me,
  # GET /users/:id (Phase 3) - see services/users-service/README.md.
  # Own `auth` profile (not `node-workers`) - see the `auth` profile note above.
  users-service:
    profiles: ['auth']
    build:
      context: ../../services/users-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/users-service/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crm
      RABBITMQ_URL: amqp://crm:crm_local_only@rabbitmq:5672
    ports:
      - '4002:4002'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Same outbox-publisher image, redeployed against companies-service's own
  # schema (Q8). Own `companies` profile so it starts/stops with
  # companies-service only.
  outbox-publisher-companies:
    profiles: ['companies']
    build:
      context: ../../services/outbox-publisher
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crm?options=-c%20search_path%3Dcompanies_schema
      RABBITMQ_URL: amqp://crm:crm_local_only@rabbitmq:5672
      HEALTH_PORT: '4503'
    ports:
      - '4503:4503'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Owns company profile data - see services/companies-service/README.md.
  # Own `companies` profile (not `auth`/`node-workers`).
  companies-service:
    profiles: ['companies']
    build:
      context: ../../services/companies-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/companies-service/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crm
    ports:
      - '4003:4003'
    depends_on:
      postgres:
        condition: service_healthy

  # Consumes domain.events + analytics.events, writes emails (Postgres
  # `email_logs`) and in-app notifications (`notifications`). Logical owner
  # of both tables during the MVP phase - see docs/architecture/service-ownership.md.
  notifications-service:
    profiles: ['node-workers']
    build:
      context: ../../services/notifications-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/notifications-service/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crm
      RABBITMQ_URL: amqp://crm:crm_local_only@rabbitmq:5672
    ports:
      - '4300:4300'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # No Postgres dependency at all - watches every message on both exchanges
  # and serves counts/latency at :4100/metrics (Prometheus text) and
  # :4100/health (JSON). Has a like-for-like Python sibling in services/ai-service.
  metrics-service:
    profiles: ['node-workers']
    build:
      context: ../../services/metrics-service
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://crm:crm_local_only@rabbitmq:5672
      METRICS_PORT: '4100'
    ports:
      - '4100:4100'
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Consumes ai.* result events published by services/ai-service and writes
  # safe, denormalized projection rows into the main database - the only
  # service besides the backend API allowed to write to main-postgres, and
  # only into its own projection tables (never business tables).
  backend-projection-service:
    profiles: ['node-workers']
    build:
      context: ../../services/backend-projection-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/backend-projection-service/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crm
      RABBITMQ_URL: amqp://crm:crm_local_only@rabbitmq:5672
    ports:
      - '4400:4400'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Python AI/analytics microservice, owns its own postgres-ai instance -
  # never shares a database or credentials with the main backend.
  ai-service:
    profiles: ['python-workers']
    build:
      context: ../../services/ai-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/ai-service/.env
    environment:
      AI_DATABASE_URL: postgres://ai:ai_password@postgres-ai:5432/ai
      RABBITMQ_URL: amqp://crm:crm_local_only@rabbitmq:5672
      PYTHON_METRICS_PORT: '4200'
    ports:
      - '4200:4200'
    depends_on:
      postgres-ai:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
