# Fast local dev loop: Traefik gateway only — no app containers, no
# rebuild-on-every-change. Run microservices on the host via `yarn dev:*`
# (see scripts/dev/README.md); Traefik routes to host.docker.internal per
# docker/dev/traefik/dynamic.host.yml.
#
# Combine with the infra stack:
#   yarn dev:infra
#
# Then, on the host (examples):
#   yarn dev:auth:app
#   yarn dev:companies
#   yarn dev:dashboard:app
#
# Frontend points VITE_API_URL at http://localhost:8080 — see
# docs/architecture/url-convention.md and docs/architecture/gateway-routing.md.

services:
  gateway:
    image: traefik:v3.0
    command:
      - '--providers.file.filename=/etc/traefik/dynamic.yml'
      - '--providers.file.watch=true'
      - '--entrypoints.web.address=:8080'
      - '--entrypoints.web.http.middlewares=cors@file'
      - '--entrypoints.traefik.address=:8081'
      - '--api.dashboard=true'
      # Dashboard is unauthenticated on :8081 — local dev only.
      - '--api.insecure=true'
    ports:
      - '8080:8080'
      - '8081:8081'
    volumes:
      - ./traefik/dynamic.host.yml:/etc/traefik/dynamic.yml:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
