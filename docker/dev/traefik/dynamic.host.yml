# Traefik file-provider config for docker/dev/compose.gateway.yml (fast local
# dev loop: only infra + gateway run in Docker; microservices run on the host
# via `yarn dev` for instant reload).
#
# Target is "http://host.docker.internal:PORT" - Docker Desktop's special
# DNS name for reaching the host machine from inside a container.
#
# This file must stay in sync with dynamic.container.yml: same routers, same
# rules, same priorities - only the `services.*.loadBalancer.servers.url`
# host differs (host.docker.internal:PORT here vs. <service-name>:PORT
# there). When extracting a domain, update the matching router's `service:`
# target and add the new host.docker.internal:PORT entry in both files.
# See docs/architecture/gateway-routing.md.

# See docs/architecture/gateway-routing.md. CORS middleware lives in
# docker/traefik/cors/dev.middleware.yml (mounted by compose.gateway.yml).

http:
  routers:
    auth-service-health-root:
      rule: "Path(`/health`)"
      service: auth-service
      entryPoints: [web]
      priority: 15

    auth-service: # auth-service (Phase 2)
      rule: "PathPrefix(`/auth`)"
      service: auth-service
      entryPoints: [web]
      priority: 10

    users-service-me: # users-service (Phase 3)
      rule: "Path(`/users/me`)"
      service: users-service
      entryPoints: [web]
      priority: 100
    users-service-by-id: # users-service (Phase 3)
      rule: "PathRegexp(`^/users/[^/]+$`)"
      service: users-service
      entryPoints: [web]
      priority: 50

    # ---- Companies: ordered by priority, most specific = highest number ----
    company-members-service: # company-members-service (Phase 5)
      rule: "PathRegexp(`^/companies/[^/]+/members`)"
      service: company-members-service
      entryPoints: [web]
      priority: 100
    services-catalog-service-company-services: # services-catalog-service (Phase 8)
      rule: "PathRegexp(`^/companies/[^/]+/services`)"
      service: services-catalog-service
      entryPoints: [web]
      priority: 95
    appointments-service-company-appointments: # appointments-service (Phase 9)
      rule: "PathRegexp(`^/companies/[^/]+/appointments`)"
      service: appointments-service
      entryPoints: [web]
      priority: 90
    company-specialists-service-requests-create: # company-specialists-service (Phase 7)
      rule: "PathRegexp(`^/companies/[^/]+/specialists/requests$`)"
      service: company-specialists-service
      entryPoints: [web]
      priority: 89
    company-specialists-service-requests-list: # company-specialists-service (Phase 7)
      rule: "PathRegexp(`^/companies/[^/]+/specialist-requests$`)"
      service: company-specialists-service
      entryPoints: [web]
      priority: 88
    company-specialists-service-list: # company-specialists-service (Phase 7)
      rule: "PathRegexp(`^/companies/[^/]+/specialists$`)"
      service: company-specialists-service
      entryPoints: [web]
      priority: 87
    reviews-service-company-reviews: # reviews-service (Phase 10)
      rule: "PathRegexp(`^/companies/[^/]+/reviews$`)"
      service: reviews-service
      entryPoints: [web]
      priority: 80
    dashboard-service-company-summary: # dashboard-service (Phase 15)
      rule: "PathRegexp(`^/companies/[^/]+/summary$`)"
      service: dashboard-service
      entryPoints: [web]
      priority: 79
    companies-service-status-history: # companies-service (Phase 4)
      rule: "PathRegexp(`^/companies/[^/]+/status-history$`)"
      service: companies-service
      entryPoints: [web]
      priority: 78
    companies-service-by-id: # companies-service (Phase 4) - also matches /companies/public, /companies/me
      rule: "PathRegexp(`^/companies/[^/]+$`)"
      service: companies-service
      entryPoints: [web]
      priority: 77
    companies-service-root: # companies-service (Phase 4) - POST /companies
      rule: "Path(`/companies`)"
      service: companies-service
      entryPoints: [web]
      priority: 77

    # ---- Specialists: ordered by priority, most specific = highest number ----
    specialists-service-profile-create: # specialists-service (Phase 6)
      rule: "Path(`/specialists/profile`)"
      service: specialists-service
      entryPoints: [web]
      priority: 100
    specialists-service-status-history: # specialists-service (Phase 6)
      rule: "Path(`/specialists/me/status-history`)"
      service: specialists-service
      entryPoints: [web]
      priority: 99
    services-catalog-service-my-services: # services-catalog-service (Phase 8, Q13)
      rule: "Path(`/specialists/me/services`)"
      service: services-catalog-service
      entryPoints: [web]
      priority: 98
    company-specialists-service-company-requests: # company-specialists-service (Phase 7)
      rule: "PathRegexp(`^/specialists/me/company-requests`)"
      service: company-specialists-service
      entryPoints: [web]
      priority: 97
    company-specialists-service-my-companies: # company-specialists-service (Phase 7)
      rule: "Path(`/specialists/me/companies`)"
      service: company-specialists-service
      entryPoints: [web]
      priority: 96
    specialists-service-me: # specialists-service (Phase 6)
      rule: "Path(`/specialists/me`)"
      service: specialists-service
      entryPoints: [web]
      priority: 95
    specialists-service-public: # specialists-service (Phase 6)
      rule: "Path(`/specialists/public`)"
      service: specialists-service
      entryPoints: [web]
      priority: 94
    reviews-service-specialist-reviews: # reviews-service (Phase 10)
      rule: "PathRegexp(`^/specialists/[^/]+/reviews$`)"
      service: reviews-service
      entryPoints: [web]
      priority: 85
    specialists-service-by-id: # specialists-service (Phase 6)
      rule: "PathRegexp(`^/specialists/[^/]+$`)"
      service: specialists-service
      entryPoints: [web]
      priority: 84

    # ---- Services catalog (Phase 8: services-catalog-service) ----
    reviews-service-service-reviews: # reviews-service (Phase 10) takes priority over the generic fallback
      rule: "PathRegexp(`^/services/[^/]+/reviews$`)"
      service: reviews-service
      entryPoints: [web]
      priority: 85
    services-catalog-service-specialists: # services-catalog-service (Phase 8) - covers POST/GET/DELETE .../specialists*
      rule: "PathRegexp(`^/services/[^/]+/specialists`)"
      service: services-catalog-service
      entryPoints: [web]
      priority: 30
    services-catalog-service-public: # services-catalog-service (Phase 8)
      rule: "Path(`/services/public`)"
      service: services-catalog-service
      entryPoints: [web]
      priority: 20
    services-catalog-service-by-id: # services-catalog-service (Phase 8)
      rule: "PathRegexp(`^/services/[^/]+$`)"
      service: services-catalog-service
      entryPoints: [web]
      priority: 15

    # ---- Appointments (Phase 9; review sub-path -> Phase 10: reviews-service) ----
    reviews-service-appointment-review: # reviews-service (Phase 10) takes priority over appointments-service's fallback
      rule: "PathRegexp(`^/appointments/[^/]+/review$`)"
      service: reviews-service
      entryPoints: [web]
      priority: 85
    appointments-service-me: # appointments-service (Phase 9)
      rule: "Path(`/appointments/me`)"
      service: appointments-service
      entryPoints: [web]
      priority: 80
    appointments-service-status-history: # appointments-service (Phase 9)
      rule: "PathRegexp(`^/appointments/[^/]+/status-history$`)"
      service: appointments-service
      entryPoints: [web]
      priority: 80
    appointments-service-cancel: # appointments-service (Phase 9)
      rule: "PathRegexp(`^/appointments/[^/]+/cancel$`)"
      service: appointments-service
      entryPoints: [web]
      priority: 80

    # ---- Notifications (Phase 11: notifications-service HTTP API) ----
    notifications-service:
      rule: "PathPrefix(`/notifications`)"
      service: notifications-service
      entryPoints: [web]
      priority: 10

    # ---- Dashboard (Phase 15: dashboard-service) ----
    dashboard-service-app-summary:
      rule: "Path(`/app/summary`)"
      service: dashboard-service
      entryPoints: [web]
      priority: 10

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4001"

    users-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4002"

    companies-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4003"

    company-members-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4004"

    specialists-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4005"

    company-specialists-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4006"

    services-catalog-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4007"

    appointments-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4008"

    reviews-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4009"

    notifications-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4300"

    dashboard-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4010"
