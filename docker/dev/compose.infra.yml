# Local dev infrastructure only - no app code, nothing built from this repo.
# Combine with compose.services.yml/compose.gateway.yml as needed; see docker/dev/README.md.
#
#   docker compose -f docker/dev/compose.infra.yml up
#   docker compose -f docker/dev/compose.infra.yml --profile events up
#   docker compose -f docker/dev/compose.infra.yml --profile events --profile python-workers up

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # Reserved infrastructure - not used by any application code yet. Kept in
  # the core stack (rather than behind a profile) so it's always available
  # once a real use case (rate limiting, cache, session blacklist,
  # distributed locks) is added. Never treat Redis as a source of truth.
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    profiles: ['events']
    image: rabbitmq:3-management-alpine
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # management UI
    environment:
      # Local-only credentials. Production must inject real ones via secrets -
      # see services/outbox-publisher/.env.example and docs/architecture.
      RABBITMQ_DEFAULT_USER: crm
      RABBITMQ_DEFAULT_PASS: crm_local_only
      RABBITMQ_DEFAULT_VHOST: crm-dev
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
      interval: 5s
      timeout: 5s
      retries: 10

  db-tools:
    image: postgres:16-alpine
    profiles: ['tools']
    volumes:
      - ../../db:/db
    entrypoint: ['']

  # Dedicated Postgres for ai-service - never shares a database or
  # credentials with the main `postgres` above.
  postgres-ai:
    profiles: ['python-workers']
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai_password
      POSTGRES_DB: ai
    ports:
      - '5433:5432'
    volumes:
      - postgres-ai-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ai']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  postgres-ai-data:
