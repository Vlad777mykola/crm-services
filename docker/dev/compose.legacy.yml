# Phase 1 of docs/architecture/microservices-extraction-checklist.md: Traefik
# gateway + legacy-backend, BOTH containerized - closer to the production
# shape (docker/prod/compose.yml), useful for container-parity testing.
# No domain service has been extracted yet - this file only adds the gateway hop.
#
# Gateway is Traefik (not nginx) - see docs/architecture/gateway-routing.md for why.
#
# Uses Traefik's FILE provider, not the Docker provider: routing rules live in
# docker/dev/traefik/dynamic.container.yml, not in labels on legacy-backend
# below. This avoids depending on Docker socket access entirely (the Docker
# provider needs to talk to the Docker daemon over /var/run/docker.sock,
# which fails on some Windows/Docker Desktop setups with "Failed to retrieve
# information of the docker client and server host") - Traefik just proxies
# to "http://legacy-backend:4000" over the Compose network like a normal
# reverse proxy, no daemon access needed.
#
# For a lighter/faster loop where legacy-backend runs on the host via `yarn dev`
# instead of a container, use compose.gateway.yml instead - see docker/dev/README.md.
#
# Run (needs the `events` infra profile too, since Phase 2's auth-service/
# users-service/outbox-publisher-auth depend on RabbitMQ):
#   docker compose -f docker/dev/compose.infra.yml -f docker/dev/compose.legacy.yml \
#     --profile events up --build
#
# Frontend then points VITE_API_URL at the gateway (http://localhost:8080) instead
# of the backend directly (http://localhost:4000) - see
# docs/architecture/url-convention.md.

services:
  gateway:
    image: traefik:v3.0
    command:
      - '--providers.file.filename=/etc/traefik/dynamic.yml'
      - '--providers.file.watch=true'
      - '--entrypoints.web.address=:8080'
      - '--entrypoints.web.http.middlewares=cors@file'
      - '--entrypoints.traefik.address=:8081'
      - '--api.dashboard=true'
      # Dashboard is unauthenticated on the dedicated :8081 entrypoint - fine for
      # local dev, must be removed/protected before any shared or production
      # environment (see docs/architecture/gateway-routing.md).
      - '--api.insecure=true'
    ports:
      - '8080:8080' # app traffic - frontend -> gateway -> whichever service owns the path
      - '8081:8081' # Traefik dashboard - local dev only, never publish this in a shared environment
    volumes:
      - ./traefik/dynamic.container.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - legacy-backend
      - auth-service
      - users-service
      - companies-service
      - company-members-service
      - specialists-service
      - company-specialists-service
      - services-catalog-service
      - appointments-service
      - reviews-service

  legacy-backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file:
      - ../../backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crm
      REDIS_URL: redis://redis:6379
    ports:
      - '4000:4000' # kept for local debugging - direct calls bypass the gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Extracted in Phase 2 - the gateway routes /auth/* here instead of
  # legacy-backend (see traefik/dynamic.container.yml). legacy-backend's own
  # /auth/* code is untouched, for rollback.
  auth-service:
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile
    env_file:
      - ../../services/auth-service/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crm
      RABBITMQ_URL: amqp://crm:crm_local_only@rabbitmq:5672
    ports:
      - '4001:4001' # kept for local debugging - direct calls bypass the gateway
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Publishes auth-service's outbox_events (Q8 - same image as the shared
  # outbox-publisher, different DATABASE_URL/search_path). Required for
  # auth.user_registered to actually reach RabbitMQ in this mode.
  outbox-publisher-auth:
    build:
      context: ../../services/outbox-publisher
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crm?options=-c%20search_path%3Dauth_schema
      RABBITMQ_URL: amqp://crm:crm_local_only@rabbitmq:5672
      HEALTH_PORT: '4501'
    ports:
      - '4501:4501'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Extracted across Phase 2 (auth.user_registered consumer) and Phase 3
  # (GET/PATCH /users/me, GET /users/:id) - see traefik/dynamic.container.yml.
