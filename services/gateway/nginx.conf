# Gateway - transparent path-preserving reverse proxy.
#
# Phase 1: every route below points at legacy-backend. No behavior change from the
# client's point of view versus calling the backend directly - this only adds one
# proxy hop and starts enforcing X-Request-Id + CORS centrally.
#
# Ordering rule (see docs/architecture/url-convention.md): nginx always prefers a
# matching regex `location` over a plain prefix `location`, and evaluates regex
# locations in the order they appear in this file - so the more specific
# `/companies/:id/...` and `/specialists/...` sub-paths are declared BEFORE their
# generic fallback. When a domain is extracted in a later phase, only the
# `proxy_pass` target on its block changes - the ordering and paths do not.
#
# No /api prefix anywhere (docs/architecture/url-convention.md).

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Every request gets a request id: reuse one from the client if it sent one,
  # otherwise generate one with nginx's built-in $request_id (nginx >= 1.11.0).
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  log_format main '$remote_addr - [$time_local] "$request" $status '
                   '$body_bytes_sent "$http_referer" rid=$req_id';

  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  client_max_body_size 5m;

  upstream legacy_backend {
    server legacy-backend:4000;
  }

  # Future upstreams are added here as each service is extracted, e.g.:
  #   upstream auth_service { server auth-service:4001; }
  #   upstream users_service { server users-service:4002; }

  server {
    listen 8080;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $req_id;
    add_header X-Request-Id $req_id always;

    # CORS is centralized at the gateway once a service no longer needs to set
    # its own (today legacy-backend still sets CORS itself via `cors()` in
    # app.ts, so the gateway does not duplicate it in Phase 1 - revisit once
    # services stop being reachable directly).

    # ---- Health (each backend serves its own; gateway does not own this path) ----
    location = /health {
      proxy_pass http://legacy_backend;
    }
    location = /health/live {
      proxy_pass http://legacy_backend;
    }
    location = /health/ready {
      proxy_pass http://legacy_backend;
    }

    # ---- Auth (Phase 2 target: auth-service) ----
    location ~ ^/auth/ {
      proxy_pass http://legacy_backend;
    }

    # ---- Users (Phase 2/3 target: users-service) ----
    location ~ ^/users(/|$) {
      proxy_pass http://legacy_backend;
    }

    # ---- Companies: ordered, most specific first (Phase 4-10 targets) ----
    # company-members-service (Phase 5)
    location ~ ^/companies/[^/]+/members(/|$) {
      proxy_pass http://legacy_backend;
    }
    # services-catalog-service (Phase 8)
    location ~ ^/companies/[^/]+/services(/|$) {
      proxy_pass http://legacy_backend;
    }
    # appointments-service (Phase 9)
    location ~ ^/companies/[^/]+/appointments(/|$) {
      proxy_pass http://legacy_backend;
    }
    # company-specialists-service (Phase 7) - three distinct sub-paths
    location ~ ^/companies/[^/]+/specialists/requests$ {
      proxy_pass http://legacy_backend;
    }
    location ~ ^/companies/[^/]+/specialist-requests$ {
      proxy_pass http://legacy_backend;
    }
    location ~ ^/companies/[^/]+/specialists$ {
      proxy_pass http://legacy_backend;
    }
    # reviews-service (Phase 10)
    location ~ ^/companies/[^/]+/reviews$ {
      proxy_pass http://legacy_backend;
    }
    # dashboard / future read-api (Phase 15)
    location ~ ^/companies/[^/]+/summary$ {
      proxy_pass http://legacy_backend;
    }
    # companies-service (Phase 4) - status-history and the generic company fallback
    location ~ ^/companies/[^/]+/status-history$ {
      proxy_pass http://legacy_backend;
    }
    location ~ ^/companies(/|$) {
      proxy_pass http://legacy_backend;
    }

    # ---- Specialists: ordered, most specific first ----
    # specialists-service (Phase 6)
    location = /specialists/profile {
      proxy_pass http://legacy_backend;
    }
    location = /specialists/me/status-history {
      proxy_pass http://legacy_backend;
    }
    # services-catalog-service (Phase 8, Q13)
    location = /specialists/me/services {
      proxy_pass http://legacy_backend;
    }
    # company-specialists-service (Phase 7)
    location ~ ^/specialists/me/company-requests(/|$) {
      proxy_pass http://legacy_backend;
    }
    location = /specialists/me/companies {
      proxy_pass http://legacy_backend;
    }
    # specialists-service (Phase 6) continued
    location = /specialists/me {
      proxy_pass http://legacy_backend;
    }
    location = /specialists/public {
      proxy_pass http://legacy_backend;
    }
    # reviews-service (Phase 10)
    location ~ ^/specialists/[^/]+/reviews$ {
      proxy_pass http://legacy_backend;
    }
    # specialists-service fallback (Phase 6)
    location ~ ^/specialists/ {
      proxy_pass http://legacy_backend;
    }

    # ---- Services catalog (Phase 8 target: services-catalog-service) ----
    # reviews-service (Phase 10) takes priority over the generic /services/:id fallback
    location ~ ^/services/[^/]+/reviews$ {
      proxy_pass http://legacy_backend;
    }
    location ~ ^/services/ {
      proxy_pass http://legacy_backend;
    }

    # ---- Appointments (Phase 9 target: appointments-service; review sub-path -> Phase 10) ----
    location ~ ^/appointments/[^/]+/review$ {
      proxy_pass http://legacy_backend;
    }
    location ~ ^/appointments/ {
      proxy_pass http://legacy_backend;
    }

    # ---- Notifications (Phase 11 target: notifications-service, HTTP-API-first rule) ----
    location ~ ^/notifications/ {
      proxy_pass http://legacy_backend;
    }

    # ---- Dashboard (Phase 15 decision: legacy or future read-api) ----
    location = /app/summary {
      proxy_pass http://legacy_backend;
    }

    location / {
      return 404;
    }
  }
}
